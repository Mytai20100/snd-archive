# Icon Configuration for snd-archive
# Maps file extensions and types to SVG icon files in this directory.
# Format: extension: icon_filename (without .svg)

# ── Type-level defaults ──────────────────────────────────────────
type_default:   file
type_folder:    folder
type_image:     image
type_video:     video
type_audio:     audio
type_text:      text
type_archive:   archive
type_document:  document
type_font:      font
type_database:  database

# ── Extension overrides ──────────────────────────────────────────
extensions:
  # ── Images ──
  .jpg:    image
  .jpeg:   image
  .png:    image
  .gif:    image
  .webp:   image
  .svg:    vector
  .bmp:    image
  .avif:   image
  .ico:    image
  .tif:    image
  .tiff:   image
  .psd:    psd
  .ai:     vector
  .eps:    vector
  .xcf:    psd

  # ── 3D / CAD ──
  .obj:    3d
  .fbx:    3d
  .stl:    3d
  .glb:    3d
  .gltf:   3d
  .blend:  3d
  .dae:    3d

  # ── Video ──
