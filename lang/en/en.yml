# Tips card (key-based upload API)
tips_title: "Tips"
tips_copy: "Copy"
tips_copied: "Copied"
tips_copy_failed: "Copy failed"
tips_folder_admin: "The admin API key uploads into the admin file area (the root of this server)."
tips_folder_user: "The API key of {username} uploads only into that account's own folder. Nobody can reach another account with it."
tips_admin_each_user: "Each user key uploads only into that user's own folder."
tips_key_in_header: "Put the key in the X-API-Token header, never in the URL, so it does not end up in logs or referrers."
tips_path_relative: "The path parameter is always relative to the account's own folder; absolute paths and .. are rejected."
tips_rotate: "If a key leaks, rotate it from the Users tab or from the account page."
tips_route_public: "The /up route name is public by design. Security comes from the key and from account isolation, not from hiding the URL."
tips_one_file: "Upload one file"
tips_many_files: "Upload several files in one call"
tips_big_file: "Stream a very large file"
tips_big_file_note: "The body is streamed to disk instead of being loaded into memory."
tips_chunked: "Chunked and resumable upload"
tips_chunked_note: "Send offset, total and final=1 on the last part. Repeating a part at the same offset is safe, so a failed part can simply be sent again."
tips_actions: "Rename, overwrite and the JSON response"
tips_actions_note: "A wrong key or a wrong method returns a plain 404 by design. The JSON response reports success, owner, the stored file names, the path and the size."
